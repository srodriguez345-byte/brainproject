<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Atlas cerebral | Ingeniería Biomédica</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1019;color:#f7f1ed;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial}
body{background:radial-gradient(ellipse at 50% 48%,#303746 0%,#171e2b 42%,#090e17 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,#e4c4b20a 50%,transparent 78%),radial-gradient(ellipse at 50% 100%,#c38e8230,transparent 55%)}
header{position:absolute;z-index:2;top:0;left:0;right:0;padding:clamp(18px,3vw,30px);background:linear-gradient(#090e17ed,transparent)}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#d8a99d;font-weight:700;margin-bottom:9px}
h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(25px,4vw,38px);letter-spacing:.01em;margin:0 0 7px}
header p{margin:0;color:#c4c8d0;font-size:13px;letter-spacing:.02em}
#stage{position:absolute;inset:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hint{position:absolute;z-index:2;left:50%;bottom:104px;transform:translateX(-50%);padding:9px 15px;border:1px solid #ffffff20;border-radius:30px;background:#111a28a8;color:#d7dce5;font-size:11px;white-space:nowrap;backdrop-filter:blur(12px);text-align:center}
.controls{position:absolute;z-index:2;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:9px;border:1px solid #ffffff22;border-radius:18px;background:#111a28d9;box-shadow:0 12px 40px #0006;backdrop-filter:blur(18px)}
button{min-width:43px;height:42px;border:1px solid #ffffff20;background:linear-gradient(145deg,#354154,#202b3c);color:#f8f1ed;border-radius:12px;padding:0 13px;font-size:15px;cursor:pointer;transition:background .2s,transform .2s}
button:hover{background:linear-gradient(145deg,#705b60,#354154);transform:translateY(-1px)}
button:focus-visible{outline:2px solid #e8b5a6;outline-offset:3px}
#spin{font-size:12px;min-width:125px}
#status{position:absolute;z-index:2;top:112px;left:50%;transform:translateX(-50%);color:#f0c9bd;font-size:11px;text-align:center;width:90%;letter-spacing:.03em}
.corner{position:absolute;z-index:1;right:24px;bottom:28px;color:#c5cbd6a0;font-size:9px;letter-spacing:.16em;text-transform:uppercase}
@media(max-width:560px){header{padding:18px}.hint{bottom:100px;font-size:10px}.controls{bottom:20px;gap:5px;padding:7px}.controls button{min-width:38px;height:40px;padding:0 9px}.corner{display:none}#status{top:104px}}
</style>
</head>
<body>
<header><div class="eyebrow">Proyecto de Ingeniería Biomédica</div><h1>Atlas cerebral</h1><p>Explora el modelo anatómico en tres dimensiones</p></header>
<div id="stage"><canvas id="view"></canvas></div>
<div id="status">Preparando modelo 3D…</div>
<div class="hint">Arrastra para girar · Desliza o usa + / − para acercar</div>
<div class="controls"><button id="minus" aria-label="Alejar" title="Alejar">−</button><button id="spin">Pausar giro</button><button id="plus" aria-label="Acercar" title="Acercar">+</button><button id="reset">Reiniciar</button></div>
<div class="corner">Vista interactiva · 3D</div>
<script src="https://unpkg.com/three@0.137.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.137.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(()=>{
const canvas=document.getElementById('view'),status=document.getElementById('status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);
camera.position.set(0,0,4.4);
scene.add(new THREE.HemisphereLight(0xffeee9,0x39303a,1.65));
const key=new THREE.DirectionalLight(0xffe2d7,2.5);key.position.set(3,5,6);scene.add(key);
const fill=new THREE.DirectionalLight(0xc2d9ff,1.25);fill.position.set(-5,1,-4);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffa18f,1.7);rim.position.set(0,4,-5);scene.add(rim);
const soft=new THREE.PointLight(0xffc6b8,.55,12);soft.position.set(0,-3,3);scene.add(soft);
const root=new THREE.Group();scene.add(root);
let rotating=true,drag=false,lastX=0,lastY=0,zoom=4.4,modelReady=false;
new THREE.GLTFLoader().load('./models/sara-brain.glb',g=>{
 const model=g.scene;root.add(model);
 model.traverse(obj=>{
  if(obj.isMesh){
   const mats=Array.isArray(obj.material)?obj.material:[obj.material];
   mats.forEach(m=>{if(m&&m.isMeshStandardMaterial){m.roughness=Math.max(m.roughness||0,.72);m.metalness=0;m.needsUpdate=true;}});
  }
 });
 const box=new THREE.Box3().setFromObject(model);
 const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
 model.position.sub(center);
 const max=Math.max(size.x,size.y,size.z)||1;
 model.scale.setScalar(2.3/max);
 modelReady=true;
 status.textContent='Modelo cargado · Explora libremente';
},undefined,e=>{
 console.error(e);
 status.textContent='No se pudo cargar el modelo. Comprueba la conexión e inténtalo de nuevo.';
});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;root.rotation.y+=(e.clientX-lastX)*.008;root.rotation.x+=(e.clientY-lastY)*.008;lastX=e.clientX;lastY=e.clientY;});
canvas.addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(2.2,Math.min(9,zoom+e.deltaY*.004));camera.position.z=zoom;},{passive:false});
document.getElementById('plus').onclick=()=>{zoom=Math.max(2.2,zoom-.35);camera.position.z=zoom;};
document.getElementById('minus').onclick=()=>{zoom=Math.min(9,zoom+.35);camera.position.z=zoom;};
document.getElementById('spin').onclick=e=>{rotating=!rotating;e.target.textContent=rotating?'Pausar giro':'Reanudar giro';};
document.getElementById('reset').onclick=()=>{root.rotation.set(0,0,0);zoom=4.4;camera.position.set(0,0,zoom);rotating=true;document.getElementById('spin').textContent='Pausar giro';};
function animate(){requestAnimationFrame(animate);if(rotating&&!drag&&modelReady)root.rotation.y+=.0018;renderer.render(scene,camera);}
animate();
})();
</script>
</body>
</html>
