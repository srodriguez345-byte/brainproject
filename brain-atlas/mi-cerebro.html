<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi cerebro 3D | Proyecto biomédico</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#293447 0%,#111827 48%,#070b13 100%);color:#f8f4f2;font-family:Inter,system-ui,Arial}
header{position:absolute;z-index:2;top:0;left:0;right:0;padding:18px 22px;background:linear-gradient(#080d18ed,transparent)}
h1{font-size:clamp(19px,3vw,28px);margin:0 0 5px}p{margin:0;color:#b9c5da;font-size:13px}
#stage{position:absolute;inset:0}canvas{width:100%;height:100%;display:block;touch-action:none}
.controls{position:absolute;z-index:2;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#172238d9;border:1px solid #ffffff24;padding:10px;border-radius:16px;backdrop-filter:blur(12px)}
button{border:1px solid #ffffff30;background:#263651;color:white;border-radius:10px;padding:10px 14px;font-size:16px;cursor:pointer}
#status{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);color:#d5deee;font-size:12px;text-align:center;width:90%}
a{color:#9dbbff}
</style>
</head>
<body>
<header><h1>Mi cerebro 3D</h1><p>Modelo interactivo · Ingeniería Biomédica</p></header>
<div id="stage"><canvas id="view"></canvas></div>
<div id="status">Cargando modelo 3D…</div>
<div class="controls"><button id="minus" aria-label="Alejar">−</button><button id="spin">Pausar giro</button><button id="plus" aria-label="Acercar">+</button><button id="reset">Reiniciar</button></div>
<script src="https://unpkg.com/three@0.137.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.137.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(()=> {
const canvas=document.getElementById('view'),status=document.getElementById('status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);
camera.position.set(0,0,4.4);
scene.add(new THREE.HemisphereLight(0xffeee9,0x39303a,1.65));
const key=new THREE.DirectionalLight(0xffe2d7,2.5);key.position.set(3,5,6);scene.add(key);
const fill=new THREE.DirectionalLight(0xb9d7ff,1.35);fill.position.set(-5,1,-4);scene.add(fill);\nconst rim=new THREE.DirectionalLight(0xff9e91,1.8);rim.position.set(0,4,-5);scene.add(rim);\nconst soft=new THREE.PointLight(0xffc6b8,.55,12);soft.position.set(0,-3,3);scene.add(soft);
const root=new THREE.Group();scene.add(root);
let model=null,rotating=true,drag=false,lastX=0,lastY=0,zoom=4.4;
new THREE.GLTFLoader().load('./models/sara-brain.glb',g=>{
model=g.scene;root.add(model);\nmodel.traverse(obj=>{if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true;const mats=Array.isArray(obj.material)?obj.material:[obj.material];mats.forEach(m=>{if(m&&m.isMeshStandardMaterial){m.roughness=Math.max(m.roughness||0,.72);m.metalness=0;m.needsUpdate=true;}});}});
const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
model.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;model.scale.setScalar(2.3/max);
status.textContent='Modelo anatómico 3D · Arrastra para girar y usa + / − para explorar';
},undefined,e=>{console.error(e);status.textContent='No se pudo cargar el modelo. Revisa que el archivo esté en brain-atlas/models.'});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;root.rotation.y+=(e.clientX-lastX)*.008;root.rotation.x+=(e.clientY-lastY)*.008;lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(2.2,Math.min(9,zoom+e.deltaY*.004));camera.position.z=zoom},{passive:false});
document.getElementById('plus').onclick=()=>{zoom=Math.max(2.2,zoom-.35);camera.position.z=zoom};
document.getElementById('minus').onclick=()=>{zoom=Math.min(9,zoom+.35);camera.position.z=zoom};
document.getElementById('spin').onclick=e=>{rotating=!rotating;e.target.textContent=rotating?'Pausar giro':'Reanudar giro'};
document.getElementById('reset').onclick=()=>{root.rotation.set(0,0,0);zoom=4.4;camera.position.set(0,0,zoom);rotating=true;document.getElementById('spin').textContent='Pausar giro'};
function animate(){requestAnimationFrame(animate);if(rotating&&!drag)root.rotation.y+=.0025;renderer.render(scene,camera)}animate();
})();
</script>
</body></html>
